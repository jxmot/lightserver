<!DOCTYPE html>
<html>
<head>
    <title>LED Controller</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 6px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            width: 45%;
        }
        .btn-off {
            background: #d9534f;
            width: 93%;
        }
        .btn-led {
            background: #337ab7;
        }
        .btn-active {
            background: #5cb85c !important;
            font-weight: bold;
        }
        .control-group {
            margin: 20px 0;
            text-align: left;
            background: #3a3a3a;
            padding: 15px;
            border-radius: 6px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type=range] {
            width: 100%;
            margin-bottom: 10px;
        }
        input[type=color] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>LED Controller</h1>
    <div id="status" style="color:#ffcc00; margin-bottom:10px;">
        Connecting to WebSockets...
    </div>
    <button class="btn-led" onclick="window.location.href='/'">
        Shows
    </button>
    <button class="btn-off" onclick="allOff()">
        All Off
    </button>
    <div id="ledButtons">
    </div>
    <div class="control-group">
        <label for="brightness">
            LED Brightness
        </label>
        <input 
            type="range"
            id="brightness"
            min="10"
            max="255"
            value="128">
        <label for="colorPicker">
            LED Color
        </label>
        <input
            type="color"
            id="colorPicker"
            value="#ff0000">
    </div>
</div>
<script>
var gateway = `ws://${window.location.hostname}/ws`;
var websocket;

var pixelCount = 0;
var ledStates = [];
var ledColors = [];
var ledBrightness = [];

window.addEventListener('load', initWebSocket);

function initWebSocket()
{
    websocket = new WebSocket(gateway);
    websocket.onopen = function()
    {
        document.getElementById('status').innerText = "Connected";
    };

    websocket.onclose = function()
    {
        document.getElementById('status').innerText = "Disconnected. Retrying...";
        setTimeout(initWebSocket,2000);
    };
    websocket.onmessage = onMessage;
}

function createLedButtons(count)
{
    pixelCount = count;
    var container = document.getElementById("ledButtons");
    container.innerHTML="";
    ledStates = new Array(count).fill(false);
    ledColors = new Array(count).fill("#ff0000");
    ledBrightness = new Array(count).fill(128);

    for(let i=0;i<count;i++)
    {
        let button=document.createElement("button");
        button.className="btn-led";
        button.id="led-"+i;
        button.innerText="LED "+(i+1);
        button.onclick=function()
        {
            toggleLed(i);
        };
        container.appendChild(button);
    }
}

function toggleLed(index)
{
    var state = !ledStates[index];
    ledStates[index] = state;
    var message =
    {
        type:"led",
        index:index,
        state:state
    };

    if(state)
    {
        let color = document.getElementById("colorPicker").value;
        let brightness = parseInt(document.getElementById("brightness").value);
        ledColors[index] = color;
        ledBrightness[index] = brightness;
        message.color = color;
        message.brightness = brightness;
    }
    document.getElementById("colorPicker").value = ledColors[index];
    document.getElementById("brightness").value = ledBrightness[index];
    websocket.send(JSON.stringify(message));
    updateButtons();
}

function allOff()
{
    websocket.send(JSON.stringify(
    {
        type:"alloff"
    }));
}

function updateButtons()
{
    for(let i=0;i<ledStates.length;i++)
    {
        let button = document.getElementById("led-"+i);

        if(!button) continue;

        if(ledStates[i])
            button.classList.add("btn-active");
        else
            button.classList.remove("btn-active");
    }
}

function onMessage(event)
{
    var data = JSON.parse(event.data);
    if(data.type !== "manual")
        return;

    if(data.leds)
    {
        if(pixelCount != data.leds.length)
        {
            createLedButtons(data.leds.length);
        }
        for(let i = 0; i < data.leds.length; i++)
        {
            ledStates[i] = data.leds[i].on;
            ledColors[i] = data.leds[i].color;
            ledBrightness[i] = data.leds[i].brightness;
        }
        updateButtons();
    }

    if(data.color)
        document.getElementById("colorPicker").value=data.color;

    if(data.brightness !== undefined)
        document.getElementById("brightness").value=data.brightness;
}
</script>
</body>
</html>
