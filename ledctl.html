<!DOCTYPE html>
<html>
  <head>
    <title>LED Controller</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #1e1e1e;
        color: #fff;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        margin: auto;
        background: #2b2b2b;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      button {
        padding: 12px 20px;
        font-size: 16px;
        margin: 6px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: white;
        width: 45%;
      }

      .btn-off {
        background: #d9534f;
        width: 93%;
      }

      .btn-led {
        background: #337ab7;
      }

      .control-group {
        margin: 20px 0;
        text-align: left;
        background: #3a3a3a;
        padding: 15px;
        border-radius: 6px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input[type=range] {
        width: 100%;
        margin-bottom: 10px;
      }

      input[type=color] {
        width: 100%;
        height: 40px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .switch-container {
        margin: auto;
        margin-top: 20px;
      }

      .switch {
        margin: 8px;
        width: 20%;
        display: inline-block;
      }

      .switch-label {
        margin: 6px auto;
        font-size: 16px;
        font-weight: bold;
      }

      .toggle {
        display: none
      }

      .toggle+label {
        display: block;
        position: relative;
        cursor: pointer;
        outline: 0;
        user-select: none;
        padding: 2px;
        width: 40px;
        height: 20px;
        background-color: #ddd;
        border-radius: 40px;
        margin: auto;
      }

      .toggle+label:before,
      .toggle+label:after {
        display: block;
        position: absolute;
        top: 1px;
        left: 1px;
        bottom: 1px;
        content: ""
      }

      .toggle+label:before {
        right: 1px;
        background-color: #337ab7;
        border-radius: 40px;
        transition: background .4s
      }

      .toggle+label:after {
        width: 20px;
        background-color: #d1d1d1;
        border-radius: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, .3);
        transition: margin .4s
      }

      .toggle:checked+label:before {
        background-color: #12c12d
      }

      .toggle:checked+label:after {
        margin-left: 22px
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LED Controller</h1>
      <div id="status" style="color:#ffcc00; margin-bottom:10px;"> Connecting to WebSockets... </div>
      <button class="btn-led" onclick="window.location.href='/'"> Shows </button>
      <button class="btn-off" onclick="allOff()"> All Off </button>
      <div id="ledButtons"></div>
      <div class="control-group">
        <label for="brightness"> LED Brightness </label>
        <input type="range" id="brightness" min="10" max="255" value="128">
        <label for="colorPicker"> LED Color </label>
        <input type="color" id="colorPicker" value="#ff0000">
      </div>
    </div>
    <script>
      var gateway = `ws://${window.location.hostname}/ws`;
      var websocket;
      var pixelCount = 0;
      var ledStates = [];
      var ledColors = [];
      var ledBrightness = [];
      window.addEventListener('load', initWebSocket);

      function initWebSocket() {
        websocket = new WebSocket(gateway);
        websocket.onopen = function() {
          document.getElementById('status').innerText = "Connected";
        };
        websocket.onclose = function() {
          document.getElementById('status').innerText = "Disconnected. Retrying...";
          setTimeout(initWebSocket, 2000);
        };
        websocket.onmessage = onMessage;
      }

      function createLedButtons(count) {
        pixelCount = count;
        var container = document.getElementById("ledButtons");
        container.innerHTML = "";
        ledStates = new Array(count).fill(false);
        ledColors = new Array(count).fill("#ff0000");
        ledBrightness = new Array(count).fill(128);
        for (let i = 0; i < count; i++) {
          let switchWrapper = document.createElement("div");
          switchWrapper.className = "switch";
          let toggle = document.createElement("input");
          toggle.type = "checkbox";
          toggle.className = "toggle";
          toggle.id = "led-" + i;
          toggle.onchange = function() {
            toggleLed(i, this.checked);
          };
          let label = document.createElement("label");
          label.className = "toggle-label";
          label.htmlFor = "led-" + i;
          let switchLabel = document.createElement("div");
          switchLabel.className = "switch-label";
          switchLabel.innerText = "LED " + (i + 1);
          switchWrapper.appendChild(toggle);
          switchWrapper.appendChild(label);
          switchWrapper.appendChild(switchLabel);
          container.appendChild(switchWrapper);
        }
      }

      function toggleLed(index, state) {
        ledStates[index] = state;
        var message = {
          type: "led",
          index: index,
          state: state
        };
        if (state) {
          let color = document.getElementById("colorPicker").value;
          let brightness = parseInt(document.getElementById("brightness").value);
          ledColors[index] = color;
          ledBrightness[index] = brightness;
          message.color = color;
          message.brightness = brightness;
        }
        document.getElementById("colorPicker").value = ledColors[index];
        document.getElementById("brightness").value = ledBrightness[index];
        websocket.send(JSON.stringify(message));
        updateSwitches();
      }

      function allOff() {
        websocket.send(JSON.stringify({
          type: "alloff"
        }));
      }

      function updateSwitches() {
        for (let i = 0; i < ledStates.length; i++) {
          let toggle = document.getElementById("led-" + i);
          if (!toggle) continue;
          toggle.checked = ledStates[i];
        }
      }

      function onMessage(event) {
        var data = JSON.parse(event.data);
        if (data.type !== "manual") return;
        if (data.leds) {
          if (pixelCount != data.leds.length) {
            createLedButtons(data.leds.length);
          }
          for (let i = 0; i < data.leds.length; i++) {
            ledStates[i] = data.leds[i].on;
            ledColors[i] = data.leds[i].color;
            ledBrightness[i] = data.leds[i].brightness;
          }
          updateSwitches();
        }
        if (data.color) document.getElementById("colorPicker").value = data.color;
        if (data.brightness !== undefined) document.getElementById("brightness").value = data.brightness;
      }
    </script>
  </body>
</html>
